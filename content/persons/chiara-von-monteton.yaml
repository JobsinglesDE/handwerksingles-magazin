intro: "Chiara von Monteton ist Dachdeckermeisterin aus Bochum, Craftfluencerin mit über 186.000 Instagram-Followern und eine der bekanntesten Botschafterinnen des deutschen Handwerks. Aufgewachsen im väterlichen Dachdeckerbetrieb, versuchte sie es zunächst mit einem Studium des Bau-Ingenieurwesens — brach dieses aber nach wenigen Semestern ab, um als Dachdeckerin zu arbeiten. Heute zeigt sie auf @dachdeckerin_chiara, was das Handwerk wirklich bedeutet: Höhen, Kälte, Teamwork und Stolz."
