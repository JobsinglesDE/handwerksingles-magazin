faqItems:
  - question: "Wer ist Dachdeckerin Chiara?"
    answer: >-
      Chiara von Monteton ist Dachdeckermeisterin aus Bochum und betreibt den Instagram-Kanal @dachdeckerin_chiara mit über 186.000 Followern. Sie arbeitet im väterlichen Betrieb Dachdeckerei Monteton und hat die Meisterprüfung an der Ausbildungsstätte Eslohe in Westfalen abgelegt. 2022 gewann sie den Goldenen Blogger in der Kategorie Berufliche Botschafterin.
  - question: "Hat Chiara von Monteton studiert?"
    answer: >-
      Ja — Chiara von Monteton begann nach der Schule ein Studium des Bau-Ingenieurwesens, brach es jedoch nach wenigen Semestern ab. Stattdessen startete sie ihre Ausbildung zur Dachdeckerin im väterlichen Betrieb in Bochum. Der Umweg über den Hörsaal machte ihr Profil als Botschafterin des Handwerks besonders glaubwürdig.
  - question: "Was macht Chiara Monteton auf Instagram?"
    answer: >-
      Auf @dachdeckerin_chiara zeigt Chiara von Monteton ausschließlich ihren Arbeitsalltag auf den Dächern des Ruhrgebiets — keine privaten Fotos, keine Urlaubs-Posts. Alles dreht sich ums Handwerk: Baustellen, Materialien, Teamarbeit und typische Herausforderungen des Dachdeckerberufs. Genau dieser authentische Ansatz erklärt ihre Reichweite von über 186.000 Followern.
  - question: "Welchen Preis hat Dachdeckerin Chiara gewonnen?"
    answer: >-
      Chiara von Monteton gewann 2022 den renommierten Goldenen Blogger in der Kategorie Berufliche Botschafterin — eine der bekanntesten Social-Media-Auszeichnungen im deutschsprachigen Raum. Außerdem wurde sie mit dem Creaton Influencer Award in der Kategorie Persönlichkeit ausgezeichnet.
takeaways:
  - "Chiara von Monteton brach ihr Ingenieurstudium ab und wurde Dachdeckermeisterin — und legte damit das Fundament für eine der reichweitenstärksten Handwerks-Präsenzen auf Instagram im DACH-Raum."
  - "Ihr Kanal @dachdeckerin_chiara zeigt ausschließlich echten Arbeitsalltag auf dem Dach — kein Privatleben, kein Lifestyle. Diese Konsequenz macht sie zur glaubwürdigsten Botschafterin des Dachdeckerhandwerks."
  - "Mit dem Goldenen Blogger 2022 und dem Creaton Influencer Award ist Chiara von Monteton auch jenseits von Instagram als Brückenbauerin zwischen Handwerk und Öffentlichkeit anerkannt."
