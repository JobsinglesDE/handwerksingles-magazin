faqItems:
  - question: "Wer ist tschulique?"
    answer: >-
      tschulique ist der Social-Media-Name von Julia Schäfer, Maurermeisterin und Betonbaumeisterin aus Kraichtal-Unteröwisheim in Baden-Württemberg. Sie arbeitet im Familienbetrieb Martin Schäfer Bau GmbH und gilt als bekannteste Handwerkerin Deutschlands auf Instagram und TikTok.
  - question: "Wie viele Follower hat tschulique?"
    answer: >-
      Julia Schäfer hat auf Instagram und TikTok zusammen über 2,5 Millionen Follower (Stand 2026). Einzelne Posts erreichen dabei über 8 Millionen Aufrufe. Sie ist damit die reichweitenstärkste Handwerks-Influencerin im deutschsprachigen Raum.
  - question: "Was macht Julia Schäfer beruflich?"
    answer: >-
      Julia Schäfer ist ausgebildete Maurermeisterin und Betonbaumeisterin. Ihre Ausbildung begann sie 2015 im väterlichen Betrieb Martin Schäfer Bau GmbH in Kraichtal. 2019 legte sie die Meisterprüfung ab. Daneben produziert sie eigenständig Social-Media-Content über den Bau-Alltag.
  - question: "Warum ist tschulique bekannt?"
    answer: >-
      tschulique zeigt auf Instagram und TikTok ungeschönt, was Arbeit am Bau bedeutet: Schalungen, Bagger, Beton und körperliche Arbeit. Damit bricht sie Klischees über Frauen im Handwerk und motiviert junge Frauen, einen Handwerksberuf zu wählen. Medien wie SWR, Stuttgarter Zeitung und Deutsche Handwerks Zeitung haben über sie berichtet.
takeaways:
  - "Julia Schäfer startete 2015 ihre Maurerlehre im Familienbetrieb und legte 2019 die Meisterprüfung ab — mit 26 Jahren war sie damit eine der jüngsten Maurermeisterinnen Deutschlands."
  - "Unter dem Namen @tschulique erreicht sie über 2,5 Millionen Menschen auf Instagram und TikTok und gilt laut Deutscher Handwerks Zeitung als bekannteste Stimme des Handwerks auf Social Media."
  - "Ihre Botschaft ist radikal einfach: Frauen bauen — genauso wie Männer. Indem sie das zeigt statt nur darüber zu reden, hat sie eine neue Generation für den Maurerberuf begeistert."
