intro: "Julia Schäfer, bekannt als @tschulique, ist Maurermeisterin und Betonbaumeisterin aus Kraichtal-Unteröwisheim in Baden-Württemberg — und mit über 2,5 Millionen Followern auf Instagram und TikTok die reichweitenstärkste Handwerkerin Deutschlands im Netz. Seit 2015 arbeitet sie im Familienbetrieb Martin Schäfer Bau GmbH, seit 2019 mit Meisterbrief. Auf Social Media zeigt sie Bau-Alltag ohne Schönreden: Schalungen, Bagger, Beton — und bricht damit Klischees über Frauen am Bau."
