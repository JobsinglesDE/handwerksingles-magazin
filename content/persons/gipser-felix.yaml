faqItems:
  - question: "Wer ist Gipser Felix?"
    answer: >-
      Felix Schröder, bekannt als Gipser Felix, ist Stuckateur und Gipser aus Bad Dürkheim in der Pfalz. Er arbeitet im Familienbetrieb Willi Schröder GmbH und betreibt die Social-Media-Kanäle @gipserfelix (Instagram) sowie @gipserfelixx (TikTok), wo er mit Baustellenvideos und Humor für das Handwerk wirbt.
  - question: "Seit wann ist Gipser Felix auf Social Media aktiv?"
    answer: >-
      Felix Schröder startete seinen Instagram-Kanal @gipserfelix im Sommer 2017. Über die Jahre wuchs seine Reichweite auf über 60.000 Follower auf Instagram. Parallel dazu ist er auf TikTok unter @gipserfelixx aktiv und betreibt den Podcast «Social Handwerk» für Handwerksbetriebe.
  - question: "Was ist der Podcast Social Handwerk von Gipser Felix?"
    answer: >-
      Im Podcast «Social Handwerk» erklärt Felix Schröder, wie Handwerksbetriebe Instagram und andere Plattformen erfolgreich für Mitarbeitergewinnung und Kundenwerbung nutzen können. Der Podcast erscheint in Kooperation mit dem handwerk magazin und richtet sich an Inhaber kleinerer und mittlerer Betriebe.
  - question: "Was macht Gipser Felix auf TikTok und Instagram?"
    answer: >-
      Auf Instagram (@gipserfelix) und TikTok (@gipserfelixx) teilt Felix Schröder Videos und Fotos aus dem Arbeitsalltag als Stuckateur: Putztechniken, Trockenbauprojekte, Stuckverzierungen — und dazu immer wieder humorvolle Clips, die zeigen, was auf der Baustelle wirklich passiert. Rund 70 % seiner Follower sind selbst im Handwerk tätig.
takeaways:
  - "Felix Schröder startete @gipserfelix 2017 und wuchs auf über 61.000 Instagram-Follower — sein Familienbetrieb Willi Schröder GmbH in Bad Dürkheim wurde bundesweit bekannt durch seine ehrlichen Baustellenvideos."
  - "Mit dem Podcast «Social Handwerk» ist Gipser Felix nicht nur Content Creator, sondern aktiver Multiplikator: Er zeigt anderen Handwerksbetrieben, wie Social Media für Mitarbeitergewinnung und Sichtbarkeit funktioniert."
  - "Rund 70 % seiner Follower sind laut eigenen Angaben selbst im Handwerk tätig — Gipser Felix erreicht exakt die Zielgruppe, die für Nachwuchsgewinnung und Branchenimage entscheidend ist."
