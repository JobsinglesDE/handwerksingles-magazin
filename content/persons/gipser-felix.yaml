intro: "Felix Schröder, bekannt als Gipser Felix, ist Stuckateur und Gipser aus Bad Dürkheim in der Pfalz. Im Familienbetrieb Willi Schröder GmbH — gegründet von seinem Großvater 1962 — hat er sein Handwerk von der Pike auf gelernt. Seit 2017 zeigt er auf Instagram und TikTok unter @gipserfelix und @gipserfelixx, wie Putz, Stuck und Trockenbau wirklich aussehen: lehrreich, ehrlich und mit einer guten Portion Baustellenhumor. Über seinen Podcast Social Handwerk erklärt er anderen Handwerksbetrieben, wie Social Media für den Mittelstand funktioniert."
