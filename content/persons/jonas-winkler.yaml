faqItems:
  - question: 'Wer ist Jonas Winkler?'
    answer: >-
      Jonas Winkler ist Tischlermeister und Produktdesigner aus der Region Hannover.
      Er betreibt einen der größten deutschsprachigen YouTube-Kanäle rund um Holzbearbeitung
      und DIY und hat über 500.000 Abonnenten. Mit seiner Frau Hannah produziert er
      außerdem den Podcast "Hör auf Dein Holz".
  - question: 'Wie ist Jonas Winkler Tischlermeister geworden?'
    answer: >-
      Jonas Winkler studierte Produktdesign und erlangte den Tischlermeisterbrief
      auf ungewöhnlichem Weg: Er reichte eigene Holzarbeiten bei der Handwerkskammer ein
      und konnte so den Meister ohne klassische Berufsausbildung erwerben.
  - question: 'Was zeigt Jonas Winkler auf YouTube?'
    answer: >-
      Auf seinem Hauptkanal veröffentlicht Jonas Winkler Tutorials, Projektdokumentationen
      und Produkttests rund um Holzbearbeitung und Möbelbau. Auf seinem zweiten Kanal
      WERKTAG erscheinen mehrmals wöchentlich Werkstattvlogs aus seinem Alltag als
      Tischlermeister.
  - question: 'Welche Unternehmen betreibt Jonas Winkler?'
    answer: >-
      Jonas Winkler ist Inhaber einer Tischlerei und eines Online-Holzhandels sowie
      Miteigentümer eines Tattoo-Studios. Seinen Content produziert er parallel
      zum laufenden Handwerksbetrieb.
takeaways:
  - 'Jonas Winkler zeigt, dass Handwerk und Social Media zusammenpassen – über 500.000 YouTube-Abonnenten folgen seinem Tischler-Alltag.'
  - 'Sein ungewöhnlicher Weg zum Meisterbrief (ohne klassische Lehre, über eingereichte Werkstücke) macht ihn zur Inspiration für Quereinsteiger im Handwerk.'
  - 'Mit Tischlerei, Online-Holzhandel und Podcast hat er ein unternehmerisches Ökosystem rund um das Material Holz aufgebaut.'
